  &lt;article class=&quot;motus-editorial&quot; data-channel=&quot;motus-blogger&quot;&gt;
&lt;section class=&quot;editorial-block block-opening-summary&quot; data-section=&quot;opening-summary&quot;&gt;&lt;h2&gt;Opening Summary&lt;/h2&gt;
&lt;p&gt;2026년 9월 15일 미국 증시는 대형주와 기술주, 중소형주가 함께 밀렸다. 유가 상승이 물가 부담을 다시 키운 데다 국채금리까지 오르면서 주식시장은 성장 기대보다 자금조달 비용과 밸류에이션 부담에 민감하게 반응했다.&lt;/p&gt;
&lt;p&gt;낙폭이 한 업종에 그치지 않고 주요 지수 전반으로 번졌다는 점이 이날 흐름을 설명한다. 한국시장에서는 미국 성장주의 약세뿐 아니라 높은 에너지 비용과 금리가 외국인 수급, 원화, 운송·화학·소비 업종에 동시에 미칠 영향을 살펴야 한다.&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;editorial-block block-market-overview&quot; data-section=&quot;market-overview&quot;&gt;&lt;h2&gt;시장 한눈에 보기&lt;/h2&gt;
&lt;div class=&quot;market-dashboard&quot; style=&quot;overflow-x:auto;margin:14px 0 26px&quot;&gt;&lt;table style=&quot;width:100%;border-collapse:collapse;border:1px solid #dbe3ee&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;background:#071a33;color:#fff;padding:11px 12px;text-align:left&quot;&gt;지표&lt;/th&gt;&lt;th style=&quot;background:#071a33;color:#fff;padding:11px 12px;text-align:right&quot;&gt;종가&lt;/th&gt;&lt;th style=&quot;background:#071a33;color:#fff;padding:11px 12px;text-align:right&quot;&gt;등락&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;S&amp;amp;P 500&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;7585.73&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;-0.45%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;나스닥&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;25981.57&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;-0.78%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;다우지수&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;52093.11&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;-0.63%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;러셀2000&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;2870.29&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;-0.76%&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;미국 2년물 국채금리&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;4.67%&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;+2bp&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;미국 10년물 국채금리&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;5%&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;+3bp&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:left&quot;&gt;브렌트유 선물&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;$108.75&lt;/td&gt;&lt;td style=&quot;padding:10px 12px;border-top:1px solid #e7ecf3;text-align:right&quot;&gt;+2.9%&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section class=&quot;editorial-block block-market-drivers&quot; data-section=&quot;market-drivers&quot;&gt;&lt;h2&gt;시장을 움직인 핵심 요인&lt;/h2&gt;
&lt;p&gt;첫째, 매도세가 기술주에만 머물지 않았다. S&amp;amp;P 500과 다우지수, 러셀2000이 나란히 하락해 금리와 원가 부담이 대형주부터 중소형주까지 폭넓게 반영됐다.&lt;/p&gt;
&lt;p&gt;둘째, 국채금리는 전 구간에서 올랐다. 2년물은 2bp, 10년물은 3bp 상승해 단기 정책금리 기대와 장기 자금조달 비용이 함께 주식의 할인율을 밀어 올렸다.&lt;/p&gt;
&lt;p&gt;셋째, 원유 가격 상승이 주식과 채권에 동시에 부담을 줬다. 에너지 기업에는 가격 효과가 우호적일 수 있지만, 항공·운송·화학과 소비 업종에는 비용 상승과 물가 재가속 우려가 더 직접적인 변수다.&lt;/p&gt;
&lt;h3&gt;금리와 물가&lt;/h3&gt;
&lt;p&gt;이날 새 물가 발표보다 채권시장의 움직임이 더 직접적인 신호를 줬다. 2년물과 10년물 국채금리가 함께 상승했고, 다음 날 FOMC 결정을 앞둔 경계도 가격에 반영됐다. 장기금리가 높은 수준에 머무는 동안에는 성장률이 높더라도 먼 미래 이익의 현재가치가 낮아질 수 있다.&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;editorial-block block-ai-industry&quot; data-section=&quot;ai-industry&quot;&gt;&lt;h2&gt;AI·반도체 / 주요 산업&lt;/h2&gt;
&lt;p&gt;전날 글로벌 시장을 흔든 AI 종목 매도세는 이날 일부 선도 반도체주가 반등하며 진정되는 모습을 보였다. 그러나 나스닥은 약세로 마감했고, Reuters도 AI 수요의 지속성에 대한 불확실성이 투자심리를 붙잡았다고 전했다. 단기 반등과 업종 전반의 신뢰 회복을 같은 의미로 받아들이기 어려운 장이었다.&lt;/p&gt;
&lt;p&gt;미국 10년물 국채금리가 5%에 닿은 환경은 AI 성장주의 밸류에이션에 분명한 부담이다. 먼 미래의 이익 비중이 큰 기업일수록 할인율 상승에 민감하기 때문에, 기술력이나 매출 성장만으로 높은 가격을 정당화하기가 까다로워진다.&lt;/p&gt;
&lt;p&gt;이제 시장이 확인할 것은 AI 기대의 크기보다 CAPEX가 실제 매출과 이익, 현금흐름으로 이어지는 속도다. Microsoft는 데이터센터 투자를 계속 확대할 계획을 밝혔고 AMD와 NVIDIA의 공식 자료에서도 AI 컴퓨팅 수요와 공급망 투자가 이어지고 있다. 다만 전력과 설비, 공급 능력, 고객사의 투자 시기가 실적 전환 속도를 좌우할 수 있어 분기별 집행과 수익성을 함께 살펴야 한다.&lt;/p&gt;
&lt;p&gt;한국 반도체에는 HBM과 메모리, 첨단 패키징, 장비가 가장 가까운 연결 고리다. 글로벌 데이터센터 CAPEX와 가속기 수요가 계획대로 집행되면 관련 주문에 우호적일 수 있다. 반대로 5% 부근의 금리가 장기화되거나 AI 투자 회수에 대한 의문이 커지면 밸류에이션과 고객사 발주 시점이 동시에 흔들릴 수 있으므로, 국내 주가보다 실제 주문과 실적 가시성을 먼저 볼 필요가 있다.&lt;/p&gt;
&lt;h3&gt;미국 소비 체크&lt;/h3&gt;
&lt;p&gt;Dave &amp;amp; Buster&#39;s의 공식 실적에서 매출과 동일점포 매출 감소가 확인됐다. 체험형 외식과 레저 지출의 탄력을 살펴볼 보조 지표지만, 한 기업의 결과를 미국 소비 전체의 방향으로 확대해 해석하지는 않는다.&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;editorial-block block-korea-market&quot; data-section=&quot;korea-market&quot;&gt;&lt;h2&gt;한국시장 연결 포인트&lt;/h2&gt;
&lt;p&gt;미국 장기금리와 유가가 동시에 오른 조합은 한국시장에 가볍지 않다. 인터넷·플랫폼 같은 장기 성장주는 할인율 부담을 받고, 항공·운송·화학은 원가 압력을 먼저 맞을 수 있다. 정유·조선 등은 업황 수혜 가능성이 있지만 원화와 외국인 수급이 흔들리면 지수 전체의 방어력은 약해질 수 있다.&lt;/p&gt;
&lt;/section&gt;
&lt;section class=&quot;editorial-block block-checklist&quot; data-section=&quot;checklist&quot;&gt;&lt;h2&gt;오늘 체크리스트&lt;/h2&gt;
&lt;ul&gt;
&lt;li&gt;미국 국채 2년물과 10년물 금리의 추가 상승 여부&lt;/li&gt;
&lt;li&gt;나스닥 약세가 반도체와 대형 기술주 전반으로 이어지는지&lt;/li&gt;
&lt;li&gt;높은 유가가 운송·화학·소비 업종의 비용 부담으로 번지는지&lt;/li&gt;
&lt;li&gt;FOMC 결정과 향후 금리 경로에 대한 공식 설명&lt;/li&gt;
&lt;/ul&gt;
&lt;/section&gt;
&lt;section class=&quot;editorial-block glossary&quot; data-section=&quot;glossary&quot;&gt;&lt;h2&gt;용어해설&lt;/h2&gt;&lt;div class=&quot;glossary-grid&quot;&gt;&lt;article class=&quot;glossary-card&quot;&gt;&lt;h3&gt;CAPEX&lt;/h3&gt;&lt;p&gt;설비투자입니다. AI 데이터센터, 반도체, 에너지 인프라 투자 판단에 자주 등장합니다.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;glossary-card&quot;&gt;&lt;h3&gt;FOMC&lt;/h3&gt;&lt;p&gt;미국 연방공개시장위원회입니다. 기준금리와 통화정책 방향을 결정합니다.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;glossary-card&quot;&gt;&lt;h3&gt;bp&lt;/h3&gt;&lt;p&gt;basis point의 줄임말로 0.01%포인트를 뜻합니다. 금리 변화폭을 정확히 말할 때 사용합니다.&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;glossary-card&quot;&gt;&lt;h3&gt;국채금리&lt;/h3&gt;&lt;p&gt;정부가 발행한 채권의 수익률입니다. 금리가 오르면 성장주 밸류에이션과 환율, 외국인 수급에 부담이 될 수 있습니다.&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
