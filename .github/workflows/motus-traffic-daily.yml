name: MOTUS Traffic Daily

# Owner request 2026-11-04: daily traffic analysis input for the previous KST day's articles (page views, Search
# Console, Naver interest, top competing Naver blog posts). Dispatched by the daily Claude analysis task (GitHub
# cron is hours late), read-only towards the blog; the input is persisted to ops-data data/traffic/<date>/.
on:
  workflow_dispatch:
    inputs:
      run_date:
        description: Analysis date (YYYY-MM-DD, KST); the articles of the day before are analyzed. Empty = today.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: motus-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Resolve date and hydrate earlier captures from ops-data
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE="${INPUT_DATE:-$(date +%F)}"
          [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          git fetch origin ops-data:refs/remotes/origin/ops-data
          if git cat-file -e origin/ops-data:data/traffic 2>/dev/null; then git archive origin/ops-data data/traffic | tar -xf -; fi
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Collect the traffic analysis input
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
          SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.SEARCH_CONSOLE_CLIENT_ID }}
          SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.SEARCH_CONSOLE_CLIENT_SECRET }}
          SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.SEARCH_CONSOLE_REFRESH_TOKEN }}
          NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
          NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
          NAVER_SEARCH_CLIENT_ID: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          NAVER_SEARCH_CLIENT_SECRET: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
        run: node dist/src/traffic-daily-cli.js --date "$RUN_DATE"
      - uses: actions/upload-artifact@v4
        with:
          name: motus-traffic-${{ github.run_id }}
          path: data/traffic/${{ env.RUN_DATE }}/
          if-no-files-found: error
          retention-days: 30

  persist:
    needs: collect
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: ops-data, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          name: motus-traffic-${{ github.run_id }}
          path: incoming
      - name: Commit data/traffic/<date>/ to ops-data
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.run_date }}
        run: |
          set -euo pipefail
          RUN_DATE="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
          if grep -RIlE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|(CLIENT_SECRET|REFRESH_TOKEN)=|ya29\.|1//0' incoming; then echo '::error title=Secret scan failed::traffic input contains credential material'; exit 1; fi
          git config user.name 'motus-operations-bot'; git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin ops-data && git reset --hard origin/ops-data
            mkdir -p "data/traffic/$RUN_DATE" && cp -r incoming/. "data/traffic/$RUN_DATE/"
            git add data/traffic
            if git diff --cached --quiet; then echo 'already up to date'; exit 0; fi
            git commit -q -m "ops: traffic input $RUN_DATE (${GITHUB_RUN_ID})"
            if git push origin HEAD:ops-data; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
