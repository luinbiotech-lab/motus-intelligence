name: MOTUS Market Article Depth Check (temporary)
on:
  pull_request:
    paths: ['src/operations/market-narrative.ts', 'src/operations/internal-live-daily.ts', 'src/publishers/editorial-article.ts', 'scripts/verify-market-article.mjs', '.github/workflows/motus-market-article-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-market-article.mjs
