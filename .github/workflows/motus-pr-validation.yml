name: MOTUS Pull Request Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
# A newer push to the same PR supersedes the older validation run (Actions minutes are account-limited).
concurrency:
  group: motus-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
