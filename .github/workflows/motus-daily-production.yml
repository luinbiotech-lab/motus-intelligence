name: MOTUS Daily Production Gate

on:
  workflow_dispatch:
    inputs:
      category:
        required: true
        type: choice
        options: [ai, us, korea]
      run_date:
        required: false
        type: string
  schedule:
    - cron: '45 21 * * 1-5'
    - cron: '30 3 * * 1-5'
    - cron: '30 8 * * 1-5'

permissions:
  contents: read

concurrency:
  group: motus-production-${{ github.event.schedule || inputs.category || 'manual' }}
  cancel-in-progress: false

jobs:
  verified-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      MOTUS_COMMERCE_ENABLED: 'false'
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
      GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
      SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.SEARCH_CONSOLE_CLIENT_ID }}
      SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.SEARCH_CONSOLE_CLIENT_SECRET }}
      SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.SEARCH_CONSOLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Resolve category and KST date
        shell: bash
        env:
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_DATE: ${{ inputs.run_date }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "45 21 * * 1-5") CATEGORY=us ;;
            "30 3 * * 1-5") CATEGORY=ai ;;
            "30 8 * * 1-5") CATEGORY=korea ;;
            *) CATEGORY="${INPUT_CATEGORY:-us}" ;;
          esac
          RUN_DATE="${INPUT_DATE:-$(date +%F)}"
          [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          echo "CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run build
      - run: node --test --experimental-test-isolation=none dist/tests/auto-publish-live.test.js dist/tests/daily-operations.test.js dist/tests/live-editorial-publish.test.js
      - run: npm run motus:live -- --date "$RUN_DATE" --category "$CATEGORY" --source internal
      - run: npm run search:intelligence:live -- --date "$RUN_DATE" --category "$CATEGORY"
      - name: Evaluate gate without live publication
        if: env.MOTUS_LIVE_PUBLISH_ENABLED != 'true'
        run: npm run motus:publish -- --date "$RUN_DATE" --category "$CATEGORY"
      - name: Publish exactly once after explicit workflow activation
        if: env.MOTUS_LIVE_PUBLISH_ENABLED == 'true'
        run: npm run motus:publish -- --date "$RUN_DATE" --category "$CATEGORY" --execute
      - name: Upload gate and HOLD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-production-gate-${{ env.RUN_DATE }}-${{ env.CATEGORY }}
          path: |
            data/operations/${{ env.RUN_DATE }}/${{ env.CATEGORY }}/
            data/search-intelligence/latest-live.json
          if-no-files-found: warn
