name: MOTUS Daily Production Gate

on:
  workflow_dispatch:
    inputs:
      category:
        required: true
        type: choice
        options: [ai, us, korea]
      run_date:
        required: false
        type: string
      execute_publish:
        description: Explicitly enable one controlled publish after every gate passes
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '45 21 * * 1-5'
    - cron: '30 3 * * 1-5'
    # Korea previous-session morning edition, 06:17 KST Monday-Friday. GitHub delivered the former 08:45 KST
    # slot about two hours late (after the 09:00 open), which excluded the previous session's flows, sectors and
    # movers. Since the Saturday-stamped Monday FX quote is accepted (#26), the pre-open slot is safe.
    - cron: '17 21 * * 0-4'

permissions:
  contents: read

concurrency:
  # One queue per category: a delayed run of one category must never be cancelled as the
  # superseded "pending" run when another category's schedule fires (GitHub keeps only one
  # pending run per group). Same-category runs still serialize.
  group: motus-production-${{ github.event.schedule == '45 21 * * 1-5' && 'us' || github.event.schedule == '30 3 * * 1-5' && 'ai' || github.event.schedule == '17 21 * * 0-4' && 'korea' || inputs.category || 'manual' }}
  cancel-in-progress: false

jobs:
  verified-production-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      MOTUS_PRODUCTION_RUN: 'true'
      MOTUS_COMMERCE_ENABLED: 'false'
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
      BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
      BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
      GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
      SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.SEARCH_CONSOLE_CLIENT_ID }}
      SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.SEARCH_CONSOLE_CLIENT_SECRET }}
      SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.SEARCH_CONSOLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore cached production operations state
        uses: actions/cache@v4
        with:
          path: |
            data/operations
            data/search
            data/library/publications
            data/reports/daily
          key: motus-ops-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            motus-ops-${{ runner.os }}-
      - name: Hydrate canonical operations state from ops-data
        shell: bash
        run: |
          set -euo pipefail
          hydrated=false
          for attempt in 1 2 3; do
            if git fetch origin ops-data:refs/remotes/origin/ops-data; then hydrated=true; break; fi
            sleep $((attempt * 5))
          done
          if [[ "$hydrated" == true ]]; then
            git archive origin/ops-data data | tar -xf -
            find data -name .publish-lock -prune -exec rm -rf {} +
            # The publish CLI refuses live publication without this marker, because the persisted
            # ledger is what blocks same-session duplicates across operation dates.
            git rev-parse origin/ops-data > data/.ops-data-hydrated
          else
            echo '::warning title=ops-data unavailable::live publication will HOLD (OPS_DATA_NOT_HYDRATED); simulation continues'
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Resolve category and KST date
        shell: bash
        env:
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_DATE: ${{ inputs.run_date }}
          INPUT_EXECUTE_PUBLISH: ${{ inputs.execute_publish }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "45 21 * * 1-5") CATEGORY=us ;;
            "30 3 * * 1-5") CATEGORY=ai ;;
            "17 21 * * 0-4") CATEGORY=korea ;;
            *) CATEGORY="${INPUT_CATEGORY:-us}" ;;
          esac
          RUN_DATE="${INPUT_DATE:-$(date +%F)}"
          [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          LIVE_PUBLISH=false
          if [[ ( "$SCHEDULE" == "30 3 * * 1-5" && "$CATEGORY" == "ai" ) || ( "$SCHEDULE" == "45 21 * * 1-5" && "$CATEGORY" == "us" ) || ( "$SCHEDULE" == "17 21 * * 0-4" && "$CATEGORY" == "korea" ) ]]; then
            LIVE_PUBLISH=true
          elif [[ "$INPUT_EXECUTE_PUBLISH" == "true" ]]; then
            LIVE_PUBLISH=true
          fi
          echo "CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "MOTUS_LIVE_PUBLISH_ENABLED=$LIVE_PUBLISH" >> "$GITHUB_ENV"
      - name: Require Blogger credentials before live publication
        if: env.MOTUS_LIVE_PUBLISH_ENABLED == 'true'
        shell: bash
        run: |
          missing=0
          for key in BLOGGER_BLOG_ID BLOGGER_CLIENT_ID BLOGGER_CLIENT_SECRET BLOGGER_REFRESH_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error title=Blogger authentication missing::$key is not configured in repository Actions secrets"
              missing=1
            fi
          done
          [[ "$missing" == 0 ]]
      - run: npm run typecheck
      - run: npm run build
      - run: node --test --experimental-test-isolation=none dist/tests/auto-publish-live.test.js dist/tests/daily-operations.test.js dist/tests/live-editorial-publish.test.js
      - run: npm run motus:live -- --date "$RUN_DATE" --category "$CATEGORY" --source internal
      - name: Evaluate gate without live publication
        if: env.MOTUS_LIVE_PUBLISH_ENABLED != 'true'
        run: npm run motus:publish -- --date "$RUN_DATE" --category "$CATEGORY"
      - name: Publish exactly once after explicit workflow activation
        if: env.MOTUS_LIVE_PUBLISH_ENABLED == 'true'
        run: npm run motus:publish -- --date "$RUN_DATE" --category "$CATEGORY" --execute
      - name: Record production outcome
        if: always()
        run: npm run motus:production-summary -- --date "$RUN_DATE" --category "$CATEGORY"
      - name: Capture Blogger page-view baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "data/search/$RUN_DATE"
          if [[ -z "${BLOGGER_BLOG_ID:-}" || -z "${BLOGGER_CLIENT_ID:-}" || -z "${BLOGGER_CLIENT_SECRET:-}" || -z "${BLOGGER_REFRESH_TOKEN:-}" ]]; then
            printf '%s\n' '{"state":"NOT_CONFIGURED","counts":[]}' > "data/search/$RUN_DATE/blogger-pageviews.json"
            exit 0
          fi
          TOKEN_JSON="$(curl -fsS https://oauth2.googleapis.com/token \
            -d "client_id=$BLOGGER_CLIENT_ID" \
            -d "client_secret=$BLOGGER_CLIENT_SECRET" \
            -d "refresh_token=$BLOGGER_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")"
          ACCESS_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          curl -fsS -G \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            --data-urlencode "range=7DAYS" \
            --data-urlencode "range=30DAYS" \
            --data-urlencode "range=all" \
            "https://www.googleapis.com/blogger/v3/blogs/$BLOGGER_BLOG_ID/pageviews" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"state":"PASS","capturedAt":"'"$(date -u +%FT%TZ)"'","counts":d.get("counts",[])},ensure_ascii=False,indent=2))' \
            > "data/search/$RUN_DATE/blogger-pageviews.json"
      - name: Upload gate and HOLD diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-production-gate-${{ env.RUN_DATE }}-${{ env.CATEGORY }}
          path: |
            data/operations/${{ env.RUN_DATE }}/${{ env.CATEGORY }}/
            data/search-intelligence/
            data/search/${{ env.RUN_DATE }}/
            data/library/publications/
            data/reports/daily/${{ env.RUN_DATE }}/
            data/operations/${{ env.RUN_DATE }}/weekly-monthly-feed-auto.json
            !data/**/.publish-lock
          if-no-files-found: warn
          retention-days: 90
      - name: Upload ops-data merge tool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-persist-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/src/ops-data-merge-cli.js
            dist/src/production/ops-data-merge.js
          if-no-files-found: error
          retention-days: 7
      - name: Upload persistence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/operations/${{ env.RUN_DATE }}/${{ env.CATEGORY }}/
            data/operations/${{ env.RUN_DATE }}/weekly-monthly-feed-auto.json
            data/library/publications/
            data/search/${{ env.RUN_DATE }}/
            data/reports/daily/${{ env.RUN_DATE }}/${{ env.CATEGORY }}/
            !data/**/.publish-lock
          if-no-files-found: warn
          retention-days: 7

      - name: Report withheld or failed live publication as a failed operation
        if: always() && env.MOTUS_LIVE_PUBLISH_ENABLED == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const path='data/operations/'+process.env.RUN_DATE+'/'+process.env.CATEGORY+'/auto-publish.json';
          if(!existsSync(path)){console.error('::error title=Production not verified::Missing auto-publish outcome');process.exit(1)}
          const outcome=JSON.parse(readFileSync(path,'utf8'));
          const allowedSkip=outcome.state==='SKIP' && ['ALREADY_PUBLISHED_SAME_SESSION','ALREADY_PUBLISHED_IN_PERSISTED_LEDGER'].includes(outcome.reasonCode);
          if(outcome.state==='PUBLISHED'||allowedSkip){console.log('Verified production outcome: '+outcome.state);process.exit(0)}
          console.error('::error title=Production publication not completed::'+JSON.stringify({state:outcome.state,reasonCode:outcome.reasonCode??null,reason:outcome.reason??outcome.error??null,publishCallCount:outcome.publishCallCount??0}));
          process.exit(1);
          NODE

  persist-operations-state:
    if: always()
    needs: verified-production-gate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-data
          fetch-depth: 0
          path: ops-data
      - uses: actions/download-artifact@v4
        with:
          name: motus-persistence-${{ github.run_id }}-${{ github.run_attempt }}
          path: persistence-bundle
      - uses: actions/download-artifact@v4
        with:
          name: motus-persist-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: persist-tool
      - name: Persist operation artifacts without runtime locks
        shell: bash
        run: |
          set -euo pipefail
          # Merge (never overwrite) so ledgers and Library/Search registrations can only grow.
          echo '{"type":"module"}' > persist-tool/package.json
          git -C ops-data config user.name 'motus-operations-bot'
          git -C ops-data config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git -C ops-data fetch origin ops-data
            git -C ops-data reset --hard origin/ops-data
            mkdir -p ops-data/data
            node persist-tool/ops-data-merge-cli.js persistence-bundle ops-data/data
            find ops-data/data -name .publish-lock -prune -exec rm -rf {} +
            if grep -RIlE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|BLOGGER_(CLIENT_SECRET|REFRESH_TOKEN)=' ops-data/data; then
              echo '::error title=Secret scan failed::persistence bundle contains credential material'
              exit 1
            fi
            git -C ops-data add data
            if git -C ops-data diff --cached --quiet; then echo 'ops-data already up to date'; exit 0; fi
            git -C ops-data commit -q -m "ops: persist ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            if git -C ops-data push origin HEAD:ops-data; then exit 0; fi
            echo "::warning title=ops-data push retry::attempt ${attempt} lost a race; re-merging onto the latest ops-data"
            sleep $((attempt * 5))
          done
          echo '::error title=ops-data persistence failed::publication state was not persisted; manual recovery required'
          exit 1
