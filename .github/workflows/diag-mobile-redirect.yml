name: DIAG m1 page html compare (temporary, read-only)
on:
  push:
    branches: [diag/mobile-redirect-20261108]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Compare indexed vs redirect-error pages (GET only)
        run: |
          GB='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          DT='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          fetch() { # $1 ua $2 url $3 out
            for t in 1 2 3 4 5; do
              curl -sS -L --max-redirs 10 -A "$1" -D "$3.h" -o "$3" -w '%{num_redirects} %{url_effective} %{http_code}\n' "$2" > "$3.w" || true
              grep -qi 'google.com/sorry' "$3.h" "$3.w" || return 0; sleep 25
            done; }
          n=0
          for u in https://motusnova.blogspot.com/2026/11/20-33.html https://motusnova.blogspot.com/2026/11/3-70.html https://motusnova.blogspot.com/2026/10/124-5937-1-48.html http://motusnova.blogspot.com/2026/11/3-70.html https://motusnova.blogspot.com/2026/11/3-70.html?m=1; do
            for ua in mob desk; do
              n=$((n+1)); [[ $ua == mob ]] && A="$GB" || A="$DT"
              fetch "$A" "$u" p$n
              echo "=== $ua $u"
              echo "HOPS $(grep -iE '^(HTTP|location)' p$n.h | tr -d '\r' | tr '\n' ' ' | cut -c1-400)"
              echo "FINAL $(cat p$n.w) bytes=$(wc -c < p$n)"
              grep -oiE '<link[^>]+rel=.(canonical|alternate|amphtml)[^>]*>' p$n | cut -c1-200 | sort -u | head -8 | sed 's/^/LINK /'
              grep -oiE '<meta[^>]+(robots|refresh|googlebot)[^>]*>' p$n | cut -c1-200 | sort -u | sed 's/^/META /'
              grep -oiE "(location\.(replace|href)|window\.location)[^;]{0,80}" p$n | sort -u | head -5 | sed 's/^/JS /'
              grep -oiE "b:responsive[^ ]*|class=.mobile[^ ]*|data:blog.isMobile|<body[^>]{0,120}" p$n | sort -u | head -4 | sed 's/^/TPL /'
              echo "TITLE $(grep -oiE '<title>[^<]{0,80}' p$n | head -1)"
            done
          done
