name: DIAG wire close sources (temporary, read-only)
on:
  push:
    branches: [diag/mobile-redirect-20261108]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch -q origin main && git fetch -q origin claude/korea-same-day-only && git checkout FETCH_HEAD -- src tests package.json package-lock.json tsconfig.json
          npm ci --ignore-scripts >/dev/null 2>&1 || npm install --ignore-scripts >/dev/null
          npx tsc -p . && node diag/wire-probe.mjs
        env:
          NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
          NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
