name: DIAG Blogger duplicate check (temporary, read-only)
on:
  push:
    branches: [diag/mobile-redirect-20261108]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Count Korea-close posts per title date in the public feed (no writes)
        run: |
          for i in 1 2 3 4 5 6; do
            curl -sS -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0 Safari/537.36' 'https://motusnova.blogspot.com/feeds/posts/summary?alt=json&max-results=60' -o feed.json -w 'HTTP %{http_code}\n' || true
            python3 -c 'import json;json.load(open("feed.json"))' 2>/dev/null && break; sleep 8
          done
          python3 - <<'PY'
          import json,collections
          d=json.load(open('feed.json'));rows=[]
          for e in d['feed'].get('entry',[]):
            t=e['title']['$t'];p=e['published']['$t'];u=[l['href'] for l in e['link'] if l['rel']=='alternate'][0]
            rows.append((p,t,u))
          print('FEED total',len(rows))
          for p,t,u in sorted(rows):
            if p>='2026-11-06': print('POST',p[:16],t[:60],u)
          c=collections.Counter(t.split(',')[0] for p,t,u in rows if '마감' in t and p>='2026-11-06')
          for k,v in c.items(): print('COUNT',v,k)
          PY
