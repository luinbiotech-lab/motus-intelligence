name: DIAG redirect-error page anatomy (temporary, read-only)
on:
  push:
    branches: [diag/mobile-redirect-20261108]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare an indexed post with REDIRECT_ERROR posts (GET only)
        run: |
          GB='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          DT='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          for path in /2026/11/20-33.html /2026/11/3-70.html /2026/11/11-12-061-534273-1-10.html /2026/11/gemini.html; do
            for ua in mobile desktop; do
              [[ $ua == mobile ]] && A="$GB" || A="$DT"
              for t in 1 2 3; do
                curl -sS -A "$A" -D h.txt -o p.html "https://motusnova.blogspot.com$path" -w "" || true
                grep -qi 'google.com/sorry' h.txt || break; sleep 15
              done
              echo "=== $ua $path"; grep -iE '^(HTTP|location|x-robots|cache-control|content-type)' h.txt | tr -d '\r'
              loc=$(grep -i '^location' h.txt | tr -d '\r' | awk '{print $2}')
              if [[ -n "$loc" && "$loc" != *sorry* ]]; then curl -sS -A "$A" -D h2.txt -o p.html "$loc" || true; echo "--- follow $loc"; grep -iE '^(HTTP|location|x-robots)' h2.txt | tr -d '\r'; fi
              python3 - <<'PY'
          import re
          h=open('p.html',encoding='utf8',errors='ignore').read()
          f=lambda p:re.findall(p,h,re.I)
          print('size',len(h),'canonical',f(r'<link[^>]+rel=.canonical.[^>]*>')[:2])
          print('robots',f(r'<meta[^>]+name=.robots.[^>]*>')[:2],'refresh',f(r'<meta[^>]+http-equiv=.refresh.[^>]*>')[:1])
          print('jsredirect',len(f(r'(?:window|document)\.location(?:\.href)?\s*=')),'ldjson',len(f(r'application/ld\+json')),'og:image',len(f(r'og:image')),'amphtml',f(r'<link[^>]+amphtml[^>]*>')[:1])
          print('title',f(r'<title>(.*?)</title>')[:1],'h1',len(f(r'<h1\b')),'imgs',len(f(r'<img\b')),'words',len(re.sub(r'<[^>]+>',' ',h).split()))
          PY
            done
          done
