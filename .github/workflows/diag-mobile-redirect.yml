name: diag-mobile-redirect
on: push
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          set +e; mkdir out; cd out
          ACC="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -fsS -H "$AUTH" "$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[]|select(.title=="motus-briefing-push-subscriptions")|.id')
          echo "subs: $(curl -fsS -H "$AUTH" "$ACC/storage/kv/namespaces/$ID/keys?prefix=sub:" | jq '.result|length')" > result.txt
          for K in $(curl -fsS -H "$AUTH" "$ACC/storage/kv/namespaces/$ID/keys?prefix=sub:" | jq -r '.result[].name'); do
            echo "sub endpoint host: $(curl -fsS -H "$AUTH" "$ACC/storage/kv/namespaces/$ID/values/$K" | jq -r '(.endpoint // .subscription.endpoint // "?")' | awk -F/ '{print $3}') created: $(curl -fsS -H "$AUTH" "$ACC/storage/kv/namespaces/$ID/values/$K" | jq -r '(.createdAt // .created // "?")')" >> result.txt
          done
          echo "meta keys: $(curl -fsS -H "$AUTH" "$ACC/storage/kv/namespaces/$ID/keys?prefix=meta:" | jq -c '[.result[].name]')" >> result.txt
          U=https://motus-briefing-push.luinbiotech-cc1.workers.dev/
          echo "health: $(curl -fsS ${U}health)" >> result.txt
          echo "pubkey len: $(curl -fsS ${U}vapid-public-key | wc -c)" >> result.txt
          curl -sS -D - -o /dev/null -H 'origin: https://luinbiotech-lab.github.io' ${U}vapid-public-key | tr -d '\r' | grep -i "^access-control\|^HTTP" >> result.txt
          cat result.txt; true
      - run: |
          cd out && git init -q && git checkout -q -b diag-shots && git add . && git -c user.name=diag -c user.email=diag@users.noreply.github.com commit -qm probe
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-shots
