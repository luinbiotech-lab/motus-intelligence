name: diag-mobile-redirect
on: push
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sL "https://news.einfomax.co.kr/news/articleView.html?idxno=4445196" > a.html
          python3 - <<'PY'
          import re,html
          s=open('a.html',encoding='utf-8',errors='ignore').read()
          ps=[html.unescape(re.sub(r'<[^>]+>','',p)) for p in re.findall(r'<p[^>]*>(.*?)</p>',s,re.S)]
          for p in ps:
            if '억' in p or '외국인' in p: print('P>',p.strip()[:300])
          PY
