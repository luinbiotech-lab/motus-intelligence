name: MOTUS Blogger Connection Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motus-blogger-connection.yml'
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify OAuth and MOTUS blog access without publishing
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const required = ['BLOGGER_BLOG_ID', 'BLOGGER_CLIENT_ID', 'BLOGGER_CLIENT_SECRET', 'BLOGGER_REFRESH_TOKEN'];
          const values = Object.fromEntries(required.map(key => [key, process.env[key]?.trim()]));
          const missing = required.filter(key => !values[key]);
          if (missing.length) {
            console.error('Missing Actions secrets: ' + missing.join(', '));
            process.exit(1);
          }
          const expectedBlogId = '3015267553244608361';
          if (values.BLOGGER_BLOG_ID !== expectedBlogId) {
            console.error('MOTUS_BLOG_ID_MISMATCH');
            process.exit(1);
          }
          try {
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST', redirect: 'error',
              headers: {'content-type': 'application/x-www-form-urlencoded'},
              body: new URLSearchParams({
                client_id: values.BLOGGER_CLIENT_ID,
                client_secret: values.BLOGGER_CLIENT_SECRET,
                refresh_token: values.BLOGGER_REFRESH_TOKEN,
                grant_type: 'refresh_token'
              }), signal: AbortSignal.timeout(20000)
            });
            const token = await response.json();
            if (!response.ok || !token.access_token) {
              const safeCode = ['invalid_grant', 'invalid_client', 'access_denied', 'unauthorized_client'].includes(token.error) ? token.error : 'TOKEN_REQUEST_FAILED';
              throw new Error('OAUTH_HTTP_' + response.status + ':' + safeCode);
            }
            console.log('OAUTH_REFRESH_PASS');
            const headers = {authorization: 'Bearer ' + token.access_token};
            const blogResponse = await fetch('https://www.googleapis.com/blogger/v3/blogs/' + expectedBlogId + '?fields=id,url', {
              headers, redirect: 'error', signal: AbortSignal.timeout(20000)
            });
            if (!blogResponse.ok) {
              const failure = await blogResponse.json();
              const evidence = JSON.stringify(failure);
              if (/SERVICE_DISABLED|accessNotConfigured/.test(evidence)) throw new Error('BLOGGER_API_DISABLED');
              if (/insufficientPermissions|ACCESS_TOKEN_SCOPE_INSUFFICIENT/.test(evidence)) throw new Error('BLOGGER_SCOPE_INSUFFICIENT');
              throw new Error('BLOG_ACCESS_HTTP_' + blogResponse.status);
            }
            const blog = await blogResponse.json();
            if (blog.id !== expectedBlogId || new URL(blog.url).hostname !== 'motusnova.blogspot.com') throw new Error('MOTUS_TARGET_MISMATCH');
            let member = false, pageToken = '';
            do {
              const url = new URL('https://www.googleapis.com/blogger/v3/users/self/blogs');
              url.searchParams.set('fields', 'items(id),nextPageToken');
              if (pageToken) url.searchParams.set('pageToken', pageToken);
              const membershipResponse = await fetch(url, {headers, redirect: 'error', signal: AbortSignal.timeout(20000)});
              if (!membershipResponse.ok) throw new Error('BLOG_MEMBERSHIP_HTTP_' + membershipResponse.status);
              const membership = await membershipResponse.json();
              member = (membership.items ?? []).some(item => item.id === expectedBlogId);
              pageToken = membership.nextPageToken ?? '';
            } while (!member && pageToken);
            if (!member) throw new Error('MOTUS_BLOG_NOT_IN_AUTHORIZED_ACCOUNT');
            console.log(JSON.stringify({oauth: 'PASS', targetBlog: 'MATCH', accountBlogAccess: 'PASS', publicUrl: blog.url, checkedAt: new Date().toISOString(), publishCallCount: 0}));
          } catch (error) {
            const message = error instanceof Error ? error.message : '';
            console.error(/^(OAUTH_HTTP_\d+:\w+|BLOG_ACCESS_HTTP_\d+|BLOG_MEMBERSHIP_HTTP_\d+|MOTUS_TARGET_MISMATCH|MOTUS_BLOG_NOT_IN_AUTHORIZED_ACCOUNT|BLOGGER_API_DISABLED|BLOGGER_SCOPE_INSUFFICIENT)$/.test(message) ? message : 'BLOGGER_CONNECTION_CHECK_FAILED');
            process.exitCode = 1;
          }
          NODE
