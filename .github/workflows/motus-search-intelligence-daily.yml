name: MOTUS Daily Operations Dry Run

on:
  workflow_dispatch:
    inputs:
      category:
        description: Daily category to prepare
        required: true
        default: us
        type: choice
        options:
          - us
          - korea
      run_date:
        description: KST run date (YYYY-MM-DD); blank uses current KST date
        required: false
        type: string
  schedule:
    # U.S. Market 06:45 KST (Tuesday-Saturday for Monday-Friday U.S. sessions)
    - cron: '45 21 * * 1-5'
    # AI Intelligence 12:30 KST (Monday-Friday)
    # Korea previous-session morning edition, 08:45 KST (Monday-Friday)
    - cron: '45 23 * * 0-4'

permissions:
  contents: read

concurrency:
  group: motus-daily-dry-run-global
  cancel-in-progress: false

jobs:
  daily-operations-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      MOTUS_SEARCH_MODE: dry-run
      MOTUS_AUTO_PUBLISH: 'false'
      MOTUS_COMMERCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve category and KST run date
        shell: bash
        env:
          DISPATCH_CATEGORY: ${{ inputs.category }}
          DISPATCH_RUN_DATE: ${{ inputs.run_date }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ -n "$DISPATCH_RUN_DATE" ]]; then
            RUN_DATE="$DISPATCH_RUN_DATE"
          else
            # Plain `date` avoids embedding a JS template literal inside a
            # double-quoted bash string (backticks there are command
            # substitution and `${v.year}` is a bash "bad substitution").
            RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          fi
          case "$SCHEDULE_EXPRESSION" in
            "45 21 * * 1-5") CATEGORY="us" ;;
            "45 23 * * 0-4") CATEGORY="korea" ;;
            *) CATEGORY="${DISPATCH_CATEGORY:-us}" ;;
          esac
          if [[ ! "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid run_date: expected YYYY-MM-DD" >&2
            exit 1
          fi
          [[ "$CATEGORY" == "us" || "$CATEGORY" == "korea" ]] || { echo "::error title=AI news stopped::AI and all-category generation are disabled"; exit 1; }
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "CATEGORY=$CATEGORY" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - name: Build review-ready Daily artifacts
        shell: bash
        run: |
          npm run motus:daily -- --date "$RUN_DATE" --category "$CATEGORY" --dry-run --review-package
      - name: Build Search Intelligence dry-run artifact
        run: npm run search:intelligence
      - uses: actions/upload-artifact@v4
        with:
          name: motus-daily-dry-run-${{ env.RUN_DATE }}-${{ env.CATEGORY }}
          path: |
            data/operations/${{ env.RUN_DATE }}/
            data/search-intelligence/latest-dry-run.json
          if-no-files-found: error
