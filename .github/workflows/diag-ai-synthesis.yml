name: DIAG AI synthesis fix (temporary, simulation only)
on:
  push:
    branches: [diag/ai-synthesis]
permissions: {contents: read}
jobs:
  simulate:
    runs-on: ubuntu-24.04
    env: {TZ: Asia/Seoul}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci && npm run build
      - run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Build today's AI article and evaluate the gate (no publication)
        run: |
          D=$(date +%F)
          npm run motus:live -- --date "$D" --category ai --source internal 2>&1 | grep -E 'AI_CANDIDATES|"state"' || true
          node -e 'const u=require("./data/operations/'"$D"'/ai/live-unit.json");const v=u.viewModel||{};console.log(JSON.stringify({state:u.status||u.readiness,reason:u.reasonCode,readinessReasons:u.readinessReasons,title:u.title,issues:(v.issues||[]).map(i=>i.headline+" | "+(i.evidenceRefs||[])[0])},null,1))' || true
          npm run motus:publish -- --date "$D" --category ai 2>&1 | grep -E '"state"' | head -3 || true
