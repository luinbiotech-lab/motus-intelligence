name: MOTUS Daily Catch-up Simulation

on:
  workflow_dispatch:
  schedule:
    # 07:20, 13:20 and 19:20 KST on weekdays
    - cron: '20 22 * * 0-4'
    - cron: '20 4 * * 1-5'
    - cron: '20 10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: motus-production-global
  cancel-in-progress: false

jobs:
  catch-up-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      MOTUS_PRODUCTION_RUN: 'true'
      MOTUS_COMMERCE_ENABLED: 'false'
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
      GOOGLE_SEARCH_CONSOLE_PROPERTY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_PROPERTY }}
      SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.SEARCH_CONSOLE_CLIENT_ID }}
      SEARCH_CONSOLE_CLIENT_SECRET: ${{ secrets.SEARCH_CONSOLE_CLIENT_SECRET }}
      SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.SEARCH_CONSOLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore cached production operations state
        uses: actions/cache@v4
        with:
          path: |
            data/operations
            data/search
            data/library/publications
            data/reports/daily
          key: motus-ops-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            motus-ops-${{ runner.os }}-
      - name: Hydrate canonical published state from ops-data
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin ops-data:refs/remotes/origin/ops-data; then
            git archive origin/ops-data data | tar -xf -
            find data -name .publish-lock -type f -delete
          else
            echo '::warning title=ops-data unavailable::continuing with repository/cache state only'
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Resolve KST operation window
        shell: bash
        run: |
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          HOUR="$(TZ=Asia/Seoul date +%H)"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          if (( 10#$HOUR >= 18 )); then echo 'CATEGORIES=korea ai us' >> "$GITHUB_ENV"
          elif (( 10#$HOUR >= 13 )); then echo 'CATEGORIES=ai us' >> "$GITHUB_ENV"
          elif (( 10#$HOUR >= 7 )); then echo 'CATEGORIES=us' >> "$GITHUB_ENV"
          else echo 'CATEGORIES=' >> "$GITHUB_ENV"; fi
      - run: npm run typecheck
      - run: npm run build
      - name: Re-evaluate missed operation windows without publishing
        shell: bash
        run: |
          for CATEGORY in $CATEGORIES; do
            ROOT="data/operations/$RUN_DATE/$CATEGORY"
            CANONICAL_CATEGORY="$(case "$CATEGORY" in ai) echo AI_INTELLIGENCE;; us) echo US_MARKET;; korea) echo KOREA_MARKET;; esac)"
            if [[ -f "$ROOT/publish-ledger.jsonl" ]] && grep -q "\"publicationIdentity\":\"$RUN_DATE|$CANONICAL_CATEGORY\".*\"event\":\"PUBLISHED\"" "$ROOT/publish-ledger.jsonl"; then
              echo "Already published: $RUN_DATE|$CATEGORY"
              continue
            fi
            npm run motus:live -- --date "$RUN_DATE" --category "$CATEGORY" --source internal
            npm run motus:publish -- --date "$RUN_DATE" --category "$CATEGORY"
            npm run motus:production-summary -- --date "$RUN_DATE" --category "$CATEGORY"
          done
      - name: Upload catch-up diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-catchup-${{ env.RUN_DATE }}-${{ github.run_id }}
          path: |
            data/operations/${{ env.RUN_DATE }}/
            !data/**/.publish-lock
          if-no-files-found: warn
          retention-days: 90
