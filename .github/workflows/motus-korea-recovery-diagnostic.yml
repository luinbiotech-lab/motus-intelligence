name: MOTUS Korea Recovery Diagnostic
on:
  push:
    branches:
      - fix/search-demand-korea-publish-20261028
    paths:
      - .github/workflows/motus-korea-recovery-diagnostic.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Seoul
      MOTUS_PRODUCTION_RUN: 'false'
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Probe independent Daum Finance index endpoints
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://finance.daum.net/api/quotes/KOSPI' \
            'https://finance.daum.net/api/quotes/KOSDAQ' \
            'https://finance.daum.net/api/quotes/KOSPI/days?symbolCode=KOSPI&page=1&perPage=10&pagination=true' \
            'https://finance.daum.net/api/quote/KOSPI/days?symbolCode=KOSPI&page=1&perPage=10&pagination=true' \
            'https://finance.daum.net/api/quotes/KOSDAQ/days?symbolCode=KOSDAQ&page=1&perPage=10&pagination=true' \
            'https://finance.daum.net/api/quote/KOSDAQ/days?symbolCode=KOSDAQ&page=1&perPage=10&pagination=true'; do
            echo "PROBE_URL=$url"
            tmp="$(mktemp)"
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' -H 'Accept: application/json, text/plain, */*' -H 'Referer: https://finance.daum.net/' -H 'User-Agent: Mozilla/5.0 MOTUS/1.0' "$url" || true)"
            echo "HTTP=$code"
            head -c 1200 "$tmp" | tr '\n' ' '; echo
            rm -f "$tmp"
          done
      - name: Probe Daum Finance public page
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl -L -sS -o "$tmp" -w '%{http_code}' -H 'User-Agent: Mozilla/5.0 MOTUS/1.0' 'https://finance.daum.net/' || true)"
          echo "DAUM_PUBLIC_HTTP=$code"
          python3 - "$tmp" <<'PY'
          import re,sys
          t=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          print('DAUM_PUBLIC_BYTES',len(t))
          for key in ['KOSPI','KOSDAQ','코스피','코스닥']:
              m=re.search(key,t,re.I)
              print(key, (re.sub(r'\s+',' ',t[max(0,m.start()-300):m.start()+800]) if m else 'NOT_FOUND')[:1100])
          PY
          rm -f "$tmp"
      - name: Probe Twelve Data Korean index symbols
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TWELVE_DATA_API_KEY:-}" ]]; then echo "TWELVE_DATA_API_KEY_MISSING"; exit 0; fi
          for q in KOSPI KOSDAQ KS11 KQ11; do
            echo "TWELVE_SEARCH=$q"
            curl -fsS -G 'https://api.twelvedata.com/symbol_search' --data-urlencode "symbol=$q" --data-urlencode "apikey=$TWELVE_DATA_API_KEY" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"status":d.get("status"),"data":(d.get("data") or [])[:8]},ensure_ascii=False))'
          done
      - name: Probe direct official KRX endpoints without key
        shell: bash
        run: |
          set -euo pipefail
          for path in idx/kospi_dd_trd idx/kosdaq_dd_trd; do
            url="https://openapi.krx.co.kr/svc/apis/$path?basDd=20261027"
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' -H 'Accept: application/json' -H 'User-Agent: MOTUS-Internal-Collector/1.0' "$url" || true)"
            echo "KRX_PROBE=$path HTTP=$code"
            head -c 1000 "$tmp" | tr '\n' ' '; echo
            rm -f "$tmp"
          done
      - name: Recheck 2026-10-28 Korea collection without publish
        run: npm run motus:live -- --date 2026-10-28 --category korea --source internal --at 2026-10-28T00:25:00Z
      - name: Print safe diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          root='data/operations/2026-10-28/korea'
          for name in ['live-collection.json','cross-verification.json','search-intelligence.json']:
              try:
                  d=json.load(open(f'{root}/{name}',encoding='utf-8'))
                  print(name, json.dumps(d,ensure_ascii=False)[:6000])
              except Exception as e:
                  print(name, 'ERROR', type(e).__name__)
          PY
