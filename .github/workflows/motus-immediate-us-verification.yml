name: MOTUS Immediate Daily Readiness
# verification revision: final-readiness-trigger
# verification revision: ai-korea-response-diagnostic-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motus-immediate-us-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-daily-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      MOTUS_PRODUCTION_RUN: 'true'
      MOTUS_COMMERCE_ENABLED: 'false'
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test --experimental-test-isolation=none --test-name-pattern="FRED CSV parser|exact US secondary|verified NVIDIA Vera Rubin|Korea previous-session morning contract" dist/tests/claude-review-hardening.test.js
      - name: Inspect public FRED SP500 response shape
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500&cosd=2026-07-01'
          curl -fsSL -D /tmp/fred-headers.txt -o /tmp/fred-body.txt "$URL"
          echo '--- headers ---'
          sed -n '1,20p' /tmp/fred-headers.txt
          echo '--- body first lines ---'
          sed -n '1,8p' /tmp/fred-body.txt
          echo '--- byte count ---'
          wc -c /tmp/fred-body.txt
      - name: Verify US live collection without publication
        shell: bash
        run: |
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          npm run motus:live -- --date "$RUN_DATE" --category us --source internal
      - name: Inspect Korea previous-session public API shapes
        shell: bash
        run: |
          set -euo pipefail
          SESSION_DATE="$(TZ=Asia/Seoul date -d 'yesterday' +%Y%m%d)"
          URLS=(
            'https://m.stock.naver.com/api/index/KOSPI/price?pageSize=3&page=1'
            'https://m.stock.naver.com/api/index/KOSDAQ/price?pageSize=3&page=1'
            "https://stock.naver.com/api/domestic/market/trend/daily?tradeType=KRX&marketType=ALL&bizdate=$SESSION_DATE&startIdx=0&pageSize=20"
          )
          i=0
          for URL in "${URLS[@]}"; do
            i=$((i+1))
            FILE="/tmp/naver-$i.json"
            echo "--- $URL ---"
            curl -fsSL -A 'MOTUS-Internal-Collector/1.0' "$URL" -o "$FILE"
            head -c 4000 "$FILE"
            echo
          done
      - name: Inspect NVIDIA article evidence markers
        shell: bash
        run: |
          set -euo pipefail
          URL='https://blogs.nvidia.com/blog/google-cloud-vera-rubin-infrastructure/'
          BODY="$(mktemp)"
          curl -fsSL -A 'MOTUS-Internal-Collector/1.0' "$URL" -o "$BODY"
          echo '--- meta description markers ---'
          grep -Eio '<meta[^>]+(description|og:description)[^>]*>' "$BODY" | head -n 8 || true
          echo '--- JSON-LD markers ---'
          grep -Eio '"(headline|description|articleBody)"[[:space:]]*:[[:space:]]*"[^"]{1,400}"' "$BODY" | head -n 10 || true
          echo '--- paragraph markers ---'
          grep -Eio '<p[^>]*>[^<]{60,500}</p>' "$BODY" | head -n 8 || true
      - name: Verify AI live collection without publication
        shell: bash
        run: |
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          npm run motus:live -- --date "$RUN_DATE" --category ai --source internal
      - name: Verify Korea scheduled-mode collection without publication
        shell: bash
        run: |
          RUN_DATE="$(TZ=Asia/Seoul date +%F)"
          npm run motus:live -- --date "$RUN_DATE" --category korea --source internal
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motus-immediate-us-verification-${{ github.run_id }}
          path: data/operations/
          if-no-files-found: warn
          retention-days: 7
