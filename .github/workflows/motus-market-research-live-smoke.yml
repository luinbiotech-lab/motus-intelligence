name: MOTUS Research Intake Live Smoke (read-only)
on:
  push:
    branches: [feat/verified-market-research-intake-20261028]
permissions:
  contents: read
jobs:
  research-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Inspect research data from real publisher RSS feeds without publishing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {collectMarketResearch} from './dist/src/operations/market-research-feeds.js';
          const at=new Date().toISOString();
          for(const category of ['US_MARKET','KOREA_MARKET']){
            const result=await collectMarketResearch(category,at);
            console.log(JSON.stringify({category,at,feeds:result.audit,articleCount:result.entries.length,articles:result.entries.map(x=>({publisher:x.publisher,headline:x.headline,url:x.url,publishedAt:x.publishedAt,kind:x.kind}))}));
            if(!result.entries.length)process.exitCode=1;
          }
          NODE

      - name: Inspect direct broker public research index structure (read-only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://rc.kbsec.com/today/index.able';
          const r=await fetch(url,{signal:AbortSignal.timeout(12000),headers:{'user-agent':'Mozilla/5.0 MOTUS-ResearchCollector/1.0'}});
          const html=await r.text();
          console.log(JSON.stringify({provider:'KB Securities Research',http:r.status,bytes:html.length,links:[...html.matchAll(/href=["']([^"']+\\.able[^"']*)["']/gi)].map(x=>x[1]).filter(x=>/research|report|detail|today|daily/i.test(x)).slice(0,15),hasCoreView:html.includes('KB Core View'),hasTitle:html.includes('리서치')}));
          NODE

      - name: Probe broker report page metadata without downloading PDFs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://rc.kbsec.com/today/index.able',{signal:AbortSignal.timeout(12000)});
          const html=await r.text();
          const terms=['KB Core View','KB 월간 전략','데일리 리포트','리서치'];
          for(const word of terms){const i=html.indexOf(word);console.log(JSON.stringify({term:word,offset:i,near:i>=0?html.slice(Math.max(0,i-120),i+850).replace(/\\s+/g,' ').slice(0,850):null}));}
          NODE
