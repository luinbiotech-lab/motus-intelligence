name: Claude research source probe (temporary)
on:
  push:
    branches: [diagnostics/claude-research-sources-20261030]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node diag/probe.mjs
      - run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add diag/out5 && git commit -m "probe output [skip ci]" && git push
