name: Claude deep article preview (temporary, read-only)
on:
  push:
    branches: [diagnostics/claude-research-sources-20261030]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      MOTUS_COMMERCE_ENABLED: 'false'
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/broker-research-search-rank-20261030, path: app}
      - uses: actions/checkout@v4
        with: {path: diag}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - working-directory: app
        run: |
          npm ci && npm run build
          D=$(TZ=Asia/Seoul date +%F)
          for c in us korea; do node dist/src/live-daily-cli.js --date "$D" --category $c --source internal || true; done
          mkdir -p ../diag/diag/out6 && for c in us korea; do cp -r data/operations/$D/$c ../diag/diag/out6/ || true; done
      - working-directory: diag
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add diag/out6 && git commit -m "preview output [skip ci]" && git push
