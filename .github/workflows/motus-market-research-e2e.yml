name: MOTUS Market Research Editorial E2E Readonly
on:
  push:
    branches: [feat/verified-market-research-intake-20261028]
permissions:
  contents: read
jobs:
  verified-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      MOTUS_PRODUCTION_RUN: 'true'
      MOTUS_LIVE_PUBLISH_ENABLED: 'false'
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
      NAVER_DATALAB_CLIENT_ID: ${{ secrets.NAVER_DATALAB_CLIENT_ID }}
      NAVER_DATALAB_CLIENT_SECRET: ${{ secrets.NAVER_DATALAB_CLIENT_SECRET }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Read-only US verified editorial build
        run: npm run motus:live -- --date 2026-10-28 --category us --source internal --at 2026-10-28T14:58:22Z
      - name: Read-only Korea verified closing editorial build
        run: npm run motus:live -- --date 2026-10-28 --category korea --source internal --controlled-recovery --at 2026-10-28T14:58:22Z
      - name: Verify research content and provenance in generated article
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {existsSync,readFileSync} from 'node:fs';
          for(const category of ['us','korea']){
            const root='data/operations/2026-10-28/'+category+'/';
            const raw=JSON.parse(readFileSync(root+'live-collection.json','utf8'));
            const v=JSON.parse(readFileSync(root+'verification.json','utf8'));
            const u=JSON.parse(readFileSync(root+'live-unit.json','utf8'));
            const research=u.viewModel?.marketResearch??[];
            const links=research.every(x=>u.render.html.includes(x.url));
            const labels=research.every(x=>u.render.html.includes(x.publisher));
            const brokerage=category==='korea'?(u.viewModel?.research??[]).length:0;
            console.log(JSON.stringify({category,state:raw.state,verification:v.verification,sourceDiversityPass:v.sourceDiversityPass,researchCount:research.length,brokerage,links,labels,kinds:[...new Set(research.map(x=>x.kind))]}));
            if(raw.state!=='LIVE_READY'||v.verification!=='VERIFIED'||research.length<1||!links||!labels||category==='korea'&&brokerage<1)process.exitCode=1;
          }
          NODE
