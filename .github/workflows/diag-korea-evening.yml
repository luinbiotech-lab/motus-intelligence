name: DIAG Korea evening edition (temporary, simulation only)
on:
  push:
    branches: [diag/korea-evening]
permissions: {contents: read}
jobs:
  simulate:
    runs-on: ubuntu-24.04
    env: {TZ: Asia/Seoul}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci && npm run build
      - run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Build the 2026-11-06 Korea close as of 17:10 KST (no publication)
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: |
          npm run motus:live -- --date 2026-11-06 --category korea --source internal --at 2026-11-06T08:10:00Z || true
          node -e 'const u=require("./data/operations/2026-11-06/korea/live-unit.json");const v=u.viewModel||{};console.log(JSON.stringify({state:u.status||u.readiness,reason:u.reasonCode,readinessReasons:u.readinessReasons,observed:u.observedDate,title:u.title,edition:v.edition,summary:v.marketSummary,checkpoints:(v.checkpoints||[]).map(c=>c.headline+": "+c.watchFor)},null,1))'
