name: MOTUS Broker Public Research Source Probe
on:
  push:
    branches: [diagnostics/market-broker-sources-20261028]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - run: |
          node --input-type=module <<'NODE'
          for(const [name,url,terms] of [
            ['JPMorgan','https://am.jpmorgan.com/us/en/asset-management/adv/insights/market-insights/',['A Season of Moderation','Economic Update','When will higher Treasury yields']],
            ['GoldmanSachs','https://www.goldmansachs.com/insights',['2026','market','Global Investment Research']]]){
            try{const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0'},signal:AbortSignal.timeout(15000)});const h=await r.text();console.log(JSON.stringify({name,status:r.status,bytes:h.length}));for(const term of terms){const i=h.indexOf(term);console.log(JSON.stringify({name,term,offset:i,near:i>=0?h.slice(Math.max(0,i-280),i+440).replace(/\\s+/g,' ').slice(0,700):null}));}}
            catch(e){console.log(JSON.stringify({name,error:e.name}))}
          }
          NODE

      - name: Inspect Goldman Insights article card metadata
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://www.goldmansachs.com/insights',{signal:AbortSignal.timeout(12000)}),html=await r.text();
          const refs=[...html.matchAll(/href="([^"]*\/insights\/(?:articles|topics|series)\/[^"]+)"/g)].map(m=>({href:m[1],near:html.slice(Math.max(0,m.index-130),m.index+400).replace(/\s+/g,' ').slice(0,530)}));
          console.log(JSON.stringify({refs:refs.slice(0,8),count:refs.length,dateFormats:[...new Set([...html.matchAll(/(?:Oct|October)\s+\d{1,2},?\s+2026/gi)].map(m=>m[0]))].slice(0,5)}));
          NODE

      - name: Inspect Goldman dated article cards
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://www.goldmansachs.com/insights',{signal:AbortSignal.timeout(12000)});const html=await r.text();
          for(const m of [...html.matchAll(/<a\b[^>]*href="(\/insights\/articles\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/gi)].slice(0,8)){
            const text=m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,450);
            const near=html.slice(m.index,m.index+m[0].length+300);
            console.log(JSON.stringify({href:m[1],text,date:(near.match(/(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2},?\s+2026/i)||[])[0]??null}));
          }
          NODE
